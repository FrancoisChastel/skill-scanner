name: End-to-end (Docker)

# Pre-release: run manually on the release commit (mode "local" packs and tests the checkout).
# Post-release: runs on version tags against that version on npm.
# Weekly: re-runs the latest version on npm with the latest Claude Code, Codex, OpenCode, and Pi, so a harness
# update that breaks the hooks or adapters shows up here first.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "local (pack this commit) or registry (install from npm)"
        type: choice
        options: [local, registry]
        default: local
      version:
        description: "Version to test in registry mode (default: latest on npm)"
        required: false
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    name: end-to-end suite (${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'registry' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: run the suite
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'registry' }}
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ -n "$version" ]; then bash scripts/e2e-docker.sh "$MODE" "$version"; else bash scripts/e2e-docker.sh "$MODE"; fi
